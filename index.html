 const ing=agrup(ns,i=>i.ingredientes?.nome||i.descricao).slice(0,10),es=Object.entries(ns.reduce((m,n)=>{const k=n.estab_nome||'Não identificado';m[k]=(m[k]||0)+(n.total||0);return m},{})).sort((a,b)=>b[1]-a[1]);
 const bars=(a)=>{const mx=Math.max(...a.map(x=>x[1]),1);return a.map(([k,v])=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(k)}</span><b>${brl(v)}</b></div><div style="height:7px;border-radius:4px;background:var(--ac);width:${v/mx*100}%"></div></div>`).join('')||'<p class="mu">Sem dados no mês.</p>'};
 return `<h2>Painel do mês <small class="mu">· atualiza em tempo real</small></h2><div class="g"><div class="card k"><small>Total gasto no mês</small><b>${brl(sum(ns.map(n=>n.total)))}</b></div><div class="card k"><small>Notas lançadas</small><b>${ns.length}</b></div><div class="card k"><small>Estabelecimentos</small><b>${es.length}</b></div><div class="card k"><small>Pendentes de conferência</small><b>${S.notas.filter(n=>n.leitura!=='completa'||n.status!=='conferida').length}</b></div></div>
 <div class="g2"><div class="card"><h3>Gasto por ingrediente</h3>${bars(ing)}</div><div class="card"><h3>Gasto por estabelecimento</h3>${bars(es)}</div></div>
 <div class="card tw"><h3>Últimos lançamentos</h3><table><tr><th>Quando</th><th>Funcionária</th><th>Estabelecimento</th><th class="r">Total</th></tr>${S.notas.slice(0,10).map(n=>`<tr data-a="nota:${n.id}"><td>${new Date(n.criado_em).toLocaleString('pt-BR')}</td><td>${esc(n.lancado_por_nome||'')}</td><td>${esc(n.estab_nome||'—')}</td><td class="r">${brl(n.total)}</td></tr>`).join('')}</table></div>`}
function relDados(){const r=S.rel,ns=mesNotas(r.de,r.ate);
 if(r.v==='geral')return{t:'Visão geral',ns,head:['Data','Estabelecimento','Nota','Lançado por','Situação','Total'],rows:ns.map(n=>[dt(n.data_emissao),n.estab_nome||'-',n.numero||'-',n.lancado_por_nome||'',sit(n),brl(n.total)]),sub:`Total: ${brl(sum(ns.map(n=>n.total)))} | Notas: ${ns.length}`,extra:Object.entries(ns.reduce((m,n)=>{const k=n.estab_nome||'Não identificado';m[k]=(m[k]||0)+(n.total||0);return m},{})).map(([k,v])=>[k,brl(v)])};
 if(r.v==='ing'){const m={};ns.forEach(n=>(n.itens_nota||[]).forEach(i=>{const k=(i.ingredientes?.nome||i.descricao)+'|'+(i.unidade_base||'un');const g=m[k]??={n:i.ingredientes?.nome||i.descricao,u:i.unidade_base||'un',q:0,t:0,qp:0,tp:0,c:new Set()};const q=i.unidade_base==='kg'?i.peso_total_kg:i.unidade_base==='L'?i.volume_total_l:i.quantidade;g.q+=q||0;g.t+=i.valor_total||0;if(i.valor_base!=null&&q>0){g.qp+=q;g.tp+=i.valor_total||0}g.c.add(n.id)}));
  const l=Object.values(m).sort((a,b)=>b.t-a.t);return{t:'Por ingrediente',ns,head:['Ingrediente','Qtd. total','Un.','Preço médio','Total gasto','Compras'],rows:l.map(g=>[g.n,nf(g.q),g.u,g.qp?brl(g.tp/g.qp)+'/'+g.u:'—',brl(g.t),g.c.size]),sub:`Total: ${brl(sum(l.map(g=>g.t)))}`}}
 const e=ns.filter(n=>!r.mer||(n.estab_nome||'Não identificado')===r.mer);return{t:'Por estabelecimento'+(r.mer?': '+r.mer:''),ns:e,head:['Data','Estabelecimento','CNPJ','Nota','Produto','Qtd.','Total item'],rows:e.flatMap(n=>(n.itens_nota||[]).map(i=>[dt(n.data_emissao),n.estab_nome||'-',n.cnpj||'-',n.numero||'-',i.descricao,nf(i.quantidade)+' '+(i.unidade||''),brl(i.valor_total)])),sub:`Notas: ${e.length} | Total: ${brl(sum(e.map(n=>n.total)))}`}}
function vRel(){const r=S.rel,d=relDados(),mer=[...new Set(S.notas.map(n=>n.estab_nome||'Não identificado'))].sort();
 return `<h2>Relatórios gerenciais</h2><div class="f"><label>De<input type="date" data-r="de" value="${r.de}"></label><label>Até<input type="date" data-r="ate" value="${r.ate}"></label><label>Visão<select data-r="v"><option value="geral"${r.v==='geral'?' selected':''}>Visão geral</option><option value="ing"${r.v==='ing'?' selected':''}>Por ingrediente</option><option value="est"${r.v==='est'?' selected':''}>Por estabelecimento</option></select></label>
 ${r.v==='est'?`<label>Estabelecimento<select data-r="mer"><option value="">Todos</option>${mer.map(m=>`<option${r.mer===m?' selected':''}>${esc(m)}</option>`).join('')}</select></label>`:''}</div>
 <p><button data-a="pdf">Gerar relatório em PDF</button></p><div class="card"><h3>${d.t}</h3><p>${esc(d.sub)}</p><div class="tw"><table><tr>${d.head.map(h=>`<th>${h}</th>`).join('')}</tr>${d.rows.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td class="mu">Sem dados no período.</td></tr>'}</table></div></div>`}
async function vEquipe(){const{data}=await sb.from('profiles').select('*').order('criado_em');const{data:lg}=await sb.from('log_limpeza').select('*').order('executado_em',{ascending:false}).limit(5);S.eq=data||[];S.lg=lg||[];render()}
function pEquipe(){return `<h2>Equipe e permissões</h2><div class="card tw"><table><tr><th>Nome</th><th>Perfil</th><th>Acesso</th><th></th></tr>${S.eq.map(p=>`<tr><td>${esc(p.nome)}</td><td>${p.role==='admin'?'Administrador':'Funcionária'}</td><td><span class="b ${p.ativo?'ok':'er'}">${p.ativo?'Ativo':'Desativado'}</span></td><td>${p.id===S.u.id?'':`<button class="s" data-a="tg:${p.id}:${!p.ativo}">${p.ativo?'Desativar':'Ativar'}</button>`}</td></tr>`).join('')}</table></div>
 <p class="mu">Novas funcionárias: crie o usuário (e-mail e senha) em Supabase &gt; Authentication &gt; Users. Elas entram como Funcionária automaticamente.</p>
 <div class="card tw"><h3>Limpeza automática (60 dias)</h3><table><tr><th>Execução</th><th class="r">Excluídos</th><th class="r">Falhas</th></tr>${(S.lg||[]).map(l=>`<tr><td>${new Date(l.executado_em).toLocaleString('pt-BR')}</td><td class="r">${l.excluidos}</td><td class="r">${l.falhas}</td></tr>`).join('')||'<tr><td class="mu" colspan=3>Ainda sem execuções.</td></tr>'}</table></div>`}
async function pdf(){const{jsPDF}=window.jspdf,d=new jsPDF(),r=S.rel,x=relDados(),cl=s=>String(s).replace(/\u00a0/g,' ');
 d.setFillColor(15,32,74);d.rect(0,0,210,28,'F');d.setTextColor(255);d.setFontSize(17);d.text('Wise - Relatório de compras',14,18);d.setTextColor(30);d.setFontSize(11);
 d.text(`${x.t} | Período: ${dt(r.de)} a ${dt(r.ate)}`,14,37);d.text(cl(x.sub),14,44);
 d.autoTable({startY:50,head:[x.head],body:x.rows.map(a=>a.map(cl)),headStyles:{fillColor:[15,32,74]},styles:{fontSize:8}});
 if(x.extra)d.autoTable({startY:d.lastAutoTable.finalY+8,head:[['Estabelecimento','Total gasto']],body:x.extra.map(a=>a.map(cl)),headStyles:{fillColor:[15,32,74]},styles:{fontSize:9}});
 d.save(`relatorio-${r.v}-${r.de}-${r.ate}.pdf`);await sb.from('relatorios_gerados').insert({periodo_ini:r.de,periodo_fim:r.ate,tipo:r.v})}
/* ---------- render ---------- */
async function render(){const a=$('#app');
 if(!S.u){a.innerHTML=`<div class="lg"><h2 style="color:var(--ac)">Wise</h2><div class="card"><input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><button style="width:100%" onclick="login()">Entrar</button>${S.err?`<div class="al er">${esc(S.err)}</div>`:''}</div></div>`;return}
 const tabs=isAdm()?[['painel','Painel'],['lancar','Lançar'],['hist','Histórico'],['rel','Relatórios'],['eq','Equipe']]:[['lancar','Lançar'],['hist','Histórico']];
 let m='';if(S.tab==='painel'&&isAdm())m=vPainel();else if(S.tab==='rel'&&isAdm())m=vRel();else if(S.tab==='eq'&&isAdm())m=pEquipe();else if(S.tab==='hist')m=vHist();else m=vLancar();
 a.innerHTML=`<header><b><span>Wise</span></b><span><small>${esc(S.p.nome)}</small> <button class="s" data-a="senha">Alterar senha</button> <button class="s" data-a="sair">Sair</button></span></header><main>${m}</main><nav>${tabs.map(([k,l])=>`<a data-a="tab:${k}" class="${S.tab===k?'on':''}">${l}</a>`).join('')}</nav>`;
 $('#modal').innerHTML=S.modal||''}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;if(k==='nada'){e.stopPropagation();return}
 if(k.startsWith('tab:')){S.tab=k.slice(4);S.ok='';S.erro='';S.modal=null;if(S.tab==='eq')await vEquipe();else render()}
 else if(k==='fechar'){S.modal=null;render()}else if(k==='sair')sair();
 else if(k==='senha'){const p=prompt('Nova senha (mínimo 8 caracteres):');if(p&&p.length>=8){const{error}=await sb.auth.updateUser({password:p});alert(error?'Não foi possível alterar: '+error.message:'Senha alterada.')}else if(p)alert('Use pelo menos 8 caracteres.')}
 else if(k.startsWith('nota:'))vNota(k.slice(5));
 else if(k.startsWith('conf:')){await sb.from('notas').update({status:'conferida',leitura:'completa'}).eq('id',k.slice(5));S.modal=null;await carregar();render()}
 else if(k==='add'){S.draft.itens.push({inc:[]});render()}else if(k.startsWith('rm:')){S.draft.itens.splice(+k.slice(3),1);render()}
 else if(k==='salvar')salvar();else if(k==='relerx')ler();else if(k==='cancel'){S.draft=null;S.erro='';render()}
 else if(k==='pdf')pdf();
 else if(k.startsWith('tg:')){const[,id,v]=k.split(':');await sb.from('profiles').update({ativo:v==='true'}).eq('id',id);vEquipe()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.n){S.draft.n[t.dataset.n]=t.value;const c=$('#chk');if(c&&t.dataset.n==='total')c.innerHTML=chk(conf())}
 else if(t.dataset.i!=null){S.draft.itens[+t.dataset.i][t.dataset.k]=t.value;const c=$('#chk');if(c&&t.dataset.k==='vt')c.innerHTML=chk(conf())}
 else if(t.dataset.h){S.hist[t.dataset.h]=t.value;clearTimeout(S.tm);S.tm=setTimeout(()=>{render();const el=document.querySelector(`[data-h="${t.dataset.h}"]`);if(el&&el.type!=='date'){el.focus();el.setSelectionRange(99,99)}},350)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.r){S.rel[t.dataset.r]=t.value;if(t.dataset.r==='v')S.rel.mer='';render()}});
boot();
</script></body></html>
