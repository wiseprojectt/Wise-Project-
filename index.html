<style>
:root{--bg:#f1f4f9;--sf:#fff;--tx:#0f1b3d;--mu:#64748b;--bd:#e2e8f0;--nv:#0f204a;--ac:#2563eb;--sel:#eaf1ff;--er:#b91c1c;--wn:#b45309;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--nv);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b span{color:#60a5fa}header small{opacity:.8}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nv);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{flex:1;text-align:center;color:#cbd5e1;padding:8px 2px;font-size:12px;border-radius:8px;cursor:pointer}nav a.on{color:#fff;background:#2563eb}
main{max-width:1100px;margin:0 auto;padding:16px;animation:fd .3s}@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.k small{color:var(--mu);display:block}.k b{font-size:20px}
input,select,button{font:inherit;border-radius:9px;border:1px solid var(--bd);padding:9px 10px;background:var(--sf);color:var(--tx);max-width:100%;min-width:0}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;padding:10px 16px}button.s{background:var(--sel);color:var(--ac)}button.d{background:#fee2e2;color:var(--er)}
.f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);flex:1 1 150px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--mu);padding:7px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:6px 7px;border-bottom:1px solid var(--bd)}.r{text-align:right;white-space:nowrap}
tr[data-a]{cursor:pointer}td input{width:100%;min-width:70px;padding:6px}.u input{border-color:var(--wn);background:#fffbeb;color:#111}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:#dcfce7;color:var(--ok)}.wn{background:#fef3c7;color:var(--wn)}.er{background:#fee2e2;color:var(--er)}.nt{background:var(--sel);color:var(--ac)}
.al{padding:10px 12px;border-radius:10px;margin:8px 0}.m{position:fixed;inset:0;background:#0009;z-index:20;overflow:auto;padding:16px}.mp{background:var(--bg);max-width:900px;margin:0 auto;border-radius:16px;padding:16px}
.lg{max-width:380px;margin:12vh auto;padding:0 16px}.lg input{width:100%;margin-bottom:10px}.mu{color:var(--mu)}

:root{--bg:#fff8fb;--tx:#3b1f14;--mu:#8a6f66;--bd:#f3dce6;--ac:#e8338f;--sel:#fde7f1;--bl:#2f6fe0;--ye:#ffc83d}
header{background:#fff;color:var(--tx);border-bottom:1px solid var(--bd)}header b{display:flex;align-items:center;gap:10px;font-size:18px}header b span{color:var(--ac)}header b em{color:var(--bl);font-style:normal}header img{width:38px;height:38px;border-radius:50%}
nav{background:#fff;border-top:1px solid var(--bd);overflow-x:auto;justify-content:flex-start}nav a{color:var(--mu);flex:0 0 auto;min-width:76px}nav a.on{background:var(--sel);color:var(--ac);font-weight:600}
a{color:var(--bl)}.card{box-shadow:0 1px 3px #3b1f1412}.mp{background:var(--bg)}
.lg img{display:block;margin:0 auto 10px;width:120px;height:120px;border-radius:50%}.lg h2{text-align:center;margin-bottom:14px}.lg h2 span{color:var(--ac)}.lg h2 em{color:var(--bl);font-style:normal}
.pb{height:10px;border-radius:6px;background:var(--sel);overflow:hidden}.pb div{height:100%;background:var(--ac)}.pos{color:var(--ok)}.neg{color:var(--er)}

:root{--bg:#fbf6f8;--ok:#15803d}
body{background:var(--bg)}.card{border-radius:18px;border-color:#f4e4ec;box-shadow:0 2px 10px #3b1f1410}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav a svg{display:block;margin:0 auto 2px}.sb,.ml{display:none}.srch{display:none}
header{gap:10px}header .hr{display:flex;align-items:center;gap:8px}
.bn2{border-radius:12px;padding:9px 14px;white-space:nowrap}
.chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--bd);border-radius:99px;background:#fff}
.chip i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--bl));color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.chip>span{display:none;line-height:1.15;font-size:13px}.chip small{color:var(--mu);display:block;font-size:11px}
.gt h1{font-size:24px;margin:4px 0 2px}.gt p{margin:0 0 14px;color:var(--mu)}
.k4{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:12px 0 14px}
.kc{display:flex;flex-direction:column;gap:4px;margin:0}.kc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.ico.p{background:#fde7f1;color:#e8338f}.ico.b{background:#e3edff;color:#2f6fe0}.ico.y{background:#fff1c2;color:#a8740a}.ico.g{background:#dff5e8;color:#15803d}
.bdg{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.bdg.up{background:#dff5e8;color:#15803d}.bdg.dn{background:#fde2e2;color:#b91c1c}
.hero{background:linear-gradient(135deg,#e8338f 0%,#7b4fd8 55%,#2f6fe0 100%);color:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 24px #e8338f40}
.hero small{opacity:.9}.hero b{font-size:30px;display:block;margin:2px 0 6px}.hero .pb{background:#ffffff40}.hero .pb div{background:#fff}
.ch2{position:relative;height:270px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.cw{color:var(--mu);font-size:11px;padding:4px 0}
.cd{position:relative;padding:8px 0;border-radius:10px}.cd.hoje{background:var(--sel);color:var(--ac);font-weight:700}
.dot{position:absolute;bottom:2px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%}.dot.ok{background:#2fbf71}.dot.wn{background:#f59e0b}.dot.er{background:#e5484d}
.rn{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}.rn:last-child{border:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.rn div{flex:1;min-width:0}.rn div b,.rn div small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r21,.r11{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){
 body{padding-bottom:0}
 nav{top:0;bottom:0;right:auto;width:250px;flex-direction:column;overflow-y:auto;overflow-x:hidden;background:#2b150d;border:0;padding:22px 14px}
 nav a{display:flex;flex-direction:row;gap:12px;align-items:center;color:#d9c3b9;min-width:0;width:100%;text-align:left;padding:12px 14px;border-radius:14px;font-size:15px;margin-bottom:4px;flex:none}
 nav a svg{margin:0}nav a:hover{background:#3d2218}nav a.on{background:var(--ac);color:#fff;box-shadow:0 6px 16px #e8338f55}nav a.on:hover{background:var(--ac)}
 .sb{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:19px;line-height:1.1;margin:0 6px 22px}.sb img{width:46px;height:46px;border-radius:50%;background:#fff}.sb em{color:#7fb0ff;font-style:normal}.sb span{color:#ff7fbd}
 .ml{display:block;color:#a78b80;font-size:11px;letter-spacing:.1em;margin:0 8px 8px}
 header{margin-left:250px;padding:14px 32px}.hl{display:none!important}.srch{display:block;flex:1;max-width:440px;border-radius:14px;padding:10px 14px;background:#fff}header .hr{margin-left:auto}
 main{margin-left:250px;max-width:none;padding:22px 32px}.chip>span{display:block}
 .r21{grid-template-columns:2fr 1fr}.r11{grid-template-columns:1.4fr 1fr}
}

function vFicha(){const d=S.fd,mgd=cfg('meta_margem')/100,r0=res(S.mes),cfp=r0.bruto>0?r0.fix/r0.bruto:0,ocvp=r0.ocvp!=null?r0.ocvp:(cfg('taxa_padrao')+cfg('ocv_impostos')+cfg('ocv_comissao')+cfg('ocv_inadimplencia'))/100;
 const cards=S.fi.map(f=>{const c=custoFicha(f.ficha_itens||[]),por=c.tot/f.rendimento,mg=(f.margem!=null?f.margem/100:mgd),den=1-cfp-ocvp-mg,mkp=den>0?1/den:null,sug=mkp?por*mkp:null,ma=f.preco_venda?1-cfp-ocvp-por/f.preco_venda:null;
  return `<div class="card"><h3>${esc(f.nome)} <small class="mu">rende ${nf(f.rendimento)} porção(ões)</small></h3><p>Custo total: <b>${brl(c.tot)}</b> · por porção: <b>${brl(por)}</b></p>${mkp?'':'<p class="neg">Com os números do mês, custos fixos, OCV e lucro desejado somam 100% ou mais do preço: o markup fica inviável.</p>'}<p>Markup: <b>${mkp?nf(mkp,2)+'×':'—'}</b> · Preço sugerido (CMV × markup): <b>${sug?brl(sug):'—'}</b></p><p class="mu">Markup = 1 ÷ (1 − CF% − OCV% − lucro ${nf(mg*100,0)}%), com CF% de ${pc(cfp)} e OCV% de ${pc(ocvp)}.${r0.bruto>0?'':' Sem faturamento lançado no mês, o CF% foi considerado 0.'}</p>${f.preco_venda?`<p>Preço atual ${brl(f.preco_venda)} · markup atual ${por>0?nf(f.preco_venda/por,2)+'×':'—'} · lucro real ${pc(ma)}</p>`:''}${c.falta.length?`<p class="neg">Sem preço de compra para: ${esc([...new Set(c.falta)].join(', '))}</p>`:''}<small class="mu">${(f.ficha_itens||[]).map(i=>esc(i.ingredientes?.nome)+' '+nf(i.quantidade)+i.unidade).join(' · ')}</small></div>`}).join('')||'<p class="mu">Nenhuma ficha cadastrada.</p>';
 const form=d?`<div class="card"><h3>Nova ficha técnica</h3><div class="f"><label>Produto<input data-fd="nome" value="${esc(d.nome)}" placeholder="Ex.: Milkshake 500 ml"></label><label>Rende (porções)<input data-fd="rend" inputmode="decimal" value="${esc(d.rend)}"></label><label>Margem desejada (%)<input data-fd="margem" inputmode="decimal" value="${esc(d.margem)}" placeholder="${cfg('meta_margem')||''}"></label><label>Preço de venda atual (opcional)<input data-fd="preco" inputmode="decimal" value="${esc(d.preco)}"></label></div>
 <div class="tw"><table><tr><th>Ingrediente</th><th>Qtd.</th><th>Un.</th><th></th></tr>${d.itens.map((i,x)=>`<tr><td><select data-fi="${x}" data-fk="ing"><option value="">Escolha</option>${S.ings.map(g=>`<option${i.ing===g.nome?' selected':''}>${esc(g.nome)}</option>`).join('')}</select></td><td><input data-fi="${x}" data-fk="qtd" inputmode="decimal" value="${esc(i.qtd)}"></td><td><select data-fi="${x}" data-fk="un">${['kg','g','L','ml','un'].map(u=>`<option${i.un===u?' selected':''}>${u}</option>`).join('')}</select></td><td><button class="d" data-g="rmfi:${x}">×</button></td></tr>`).join('')}</table></div><p><button class="s" data-g="addfi">+ Ingrediente</button> <button data-g="salvarficha">Salvar ficha</button> <button class="d" data-g="cancelficha">Cancelar</button></p></div>`:`<p><button data-g="novaficha">Nova ficha técnica</button></p>`;
 return `<h2>Fichas técnicas</h2><p class="mu">O custo usa o último preço de compra de cada ingrediente nas notas lançadas.</p>${form}${cards}`}
async function g(k){const rec=async()=>{await carregar();render()};
 if(k==='addcusto'){const d=$('#cd').value.trim(),v=nz($('#cv').value);if(!d||v==null)return alert('Informe a descrição e o valor.');const dia=nz($('#cdia').value);if(dia!=null&&(dia<1||dia>31))return alert('O dia deve ser de 1 a 31.');const{error}=await sb.from('custos_fixos').insert({descricao:d,categoria:$('#cc').value,valor:v,dia_vencimento:dia});if(error)return alert(error.message);rec()}
 else if(k.startsWith('pg:')){const id=k.slice(3),c=S.cf.find(x=>x.id===id),m=S.mes+'-01',r=S.cm.find(x=>x.custo_id===id&&x.mes===m);const q=r?await sb.from('custos_fixos_mes').update({pago:!r.pago,pago_em:!r.pago?hoje():null}).eq('id',r.id):await sb.from('custos_fixos_mes').insert({custo_id:id,mes:m,valor:c.valor,pago:true,pago_em:hoje()});if(q.error)return alert(q.error.message);rec()}
 else if(k.startsWith('ev:')){const c=S.cf.find(x=>x.id===k.slice(3)),n=nz(prompt('Novo valor mensal de "'+c.descricao+'":',c.valor));if(n==null||n<0)return;const{error}=await sb.from('custos_fixos').update({valor:n}).eq('id',c.id);if(error)return alert(error.message);rec()}
 else if(k.startsWith('at:')){const c=S.cf.find(x=>x.id===k.slice(3));await sb.from('custos_fixos').update({ativo:!c.ativo}).eq('id',c.id);rec()}
 else if(k==='salvarcfg'){const rows=['taxa_pix','taxa_debito','taxa_credito','taxa_padrao','ocv_impostos','ocv_comissao','ocv_inadimplencia','meta_margem','meta_gasto','dias_func'].map(c=>({chave:c,valor:nz($('#cfg_'+c).value)})).filter(r=>r.valor!=null);const{error}=await sb.from('configuracoes').upsert(rows,{onConflict:'chave'});if(error)return alert(error.message);rec()}
 else if(k==='salvarfat'){const bruto=nz($('#fb').value),data=$('#fdata').value,[din,px,db_,cr]=['fdn','fpx','fdb','fcr'].map(i=>nz($('#'+i).value));if(!data||bruto==null)return alert('Informe a data e o total vendido.');
  const split=[din,px,db_,cr].some(x=>x>0),ss=sum([din,px,db_,cr]);if(split&&Math.abs(ss-bruto)>.05)return alert('A soma das formas de pagamento ('+brl(ss)+') não bate com o total vendido ('+brl(bruto)+').');
  const taxa=split?(px||0)*cfg('taxa_pix')/100+(db_||0)*cfg('taxa_debito')/100+(cr||0)*cfg('taxa_credito')/100:bruto*cfg('taxa_padrao')/100;
  const{error}=await sb.from('faturamento_diario').upsert({data,bruto,dinheiro:din,pix:px,debito:db_,credito:cr,vendas:nz($('#fv').value),taxa:+taxa.toFixed(2),liquido:+(bruto-taxa).toFixed(2),atualizado_em:new Date().toISOString()},{onConflict:'data'});if(error)return alert(error.message);S.mes=data.slice(0,7);rec()}
 else if(k==='novaficha'){S.fd={nome:'',rend:'',margem:'',preco:'',itens:[{ing:'',qtd:'',un:'kg'}]};render()}
 else if(k==='cancelficha'){S.fd=null;render()}else if(k==='addfi'){S.fd.itens.push({ing:'',qtd:'',un:'kg'});render()}else if(k.startsWith('rmfi:')){S.fd.itens.splice(+k.slice(5),1);render()}
 else if(k==='salvarficha'){const d=S.fd,its=d.itens.filter(i=>i.ing&&nz(i.qtd)>0);if(!d.nome.trim()||!(nz(d.rend)>0)||!its.length)return alert('Informe o nome, quantas porções rende e pelo menos um ingrediente com quantidade.');
  const{data:f,error}=await sb.from('fichas_tecnicas').insert({nome:d.nome.trim(),rendimento:nz(d.rend),margem:nz(d.margem),preco_venda:nz(d.preco)}).select('id').single();if(error)return alert(error.message);
  const r2=await sb.from('ficha_itens').insert(its.map(i=>({ficha_id:f.id,ingrediente_id:S.ings.find(x=>x.nome===i.ing).id,quantidade:nz(i.qtd),unidade:i.un})));if(r2.error)return alert(r2.error.message);S.fd=null;rec()}
 else if(k==='pdfdir')pdfDir()}
async function pdfDir(){const{jsPDF}=window.jspdf,d=new jsPDF(),m=S.mes,r=res(m),rp=res(mesAnt(m)),cl=x=>String(x).replace(/\u00a0/g,' ');
 d.setFillColor(232,51,143);d.rect(0,0,210,28,'F');try{d.addImage(LOGO,'PNG',14,4,20,20)}catch(e){}d.setTextColor(255);d.setFontSize(17);d.text('Delícia Gelada - Relatório da diretoria',40,17);
 d.setTextColor(59,31,20);d.setFontSize(11);d.text('Mês de referência: '+m.split('-').reverse().join('/'),14,37);
 const T=(h,b)=>d.autoTable({startY:(d.lastAutoTable?.finalY||40)+8,head:[h],body:b.map(a=>a.map(cl)),headStyles:{fillColor:[232,51,143]},styles:{fontSize:9}});
 T(['Indicador','Mês','Mês anterior'],[['Faturamento bruto',brl(r.bruto),brl(rp.bruto)],['Faturamento líquido',brl(r.liq),brl(rp.liq)],['Custos fixos',brl(r.fix),brl(rp.fix)],['CMV (compras do mês)',brl(r.cmv),brl(rp.cmv)],['OCV (maquininha, impostos, comissões)',brl(r.ocv),brl(rp.ocv)],['CMV % do faturamento',pc(r.cmvp),pc(rp.cmvp)],['OCV % do faturamento',pc(r.ocvp),pc(rp.ocvp)],['Lucro estimado',brl(r.lucro),brl(rp.lucro)],['Margem',pc(r.mg),pc(rp.mg)],['Ponto de equilíbrio',r.pe==null?'-':brl(r.pe),rp.pe==null?'-':brl(rp.pe)],['Meta de faturamento',r.meta?brl(r.meta):'-','-'],['Notas não conferidas incluídas',r.pend,rp.pend]]);
 T(['Custo fixo','Categoria','Valor'],S.cf.filter(c=>c.ativo).map(c=>[c.descricao,c.categoria,brl(fixoMes(c,m))]));
 const mer={},ing={};r.ns.forEach(n=>{const k=n.estab_nome||'Não identificado';mer[k]=(mer[k]||0)+vCusto(n);(n.itens_nota||[]).forEach(i=>{const q=i.ingredientes?.nome||i.descricao;ing[q]=(ing[q]||0)+Number(i.valor_total||0)})});
 T(['Compras por mercado','Total'],Object.entries(mer).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,brl(v)]));
 T(['Ingredientes com maior gasto','Total'],Object.entries(ing).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([k,v])=>[k,brl(v)]));
 const al=alertasPreco().slice(0,10);if(al.length)T(['Ingrediente com aumento de preço','Último preço','Aumento'],al.map(a=>[nm_(a.k),brl(a.u.p)+'/'+un_(a.k),'+'+nf(a.pct,0)+'%']));
 d.save('relatorio-diretoria-'+m+'.pdf');await sb.from('relatorios_gerados').insert({periodo_ini:m+'-01',periodo_fim:m+'-28',tipo:'diretoria'})}
document.addEventListener('click',e=>{const a=e.target.closest('[data-g]');if(a)g(a.dataset.g)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.mes!==undefined){S.mes=t.value||S.mes;render()}else if(t.dataset.fi!==undefined){S.fd.itens[+t.dataset.fi][t.dataset.fk]=t.value;if(t.tagName==='SELECT')render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.sim!==undefined){S.sim=nz(t.value);const x=$('#simres');if(x)x.innerHTML=simRes();return}if(t.dataset.fd)S.fd[t.dataset.fd]=t.value;else if(t.dataset.fi!==undefined&&t.tagName==='INPUT')S.fd.itens[+t.dataset.fi][t.dataset.fk]=t.value});

/* ---------- render ---------- */
async function render(){const a=$('#app');
 if(!S.u){a.innerHTML=`<div class="lg"><img src="${LOGO}" alt="Delícia Gelada"><h2><span>Delícia</span> <em>Gelada</em></h2><div class="card"><input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><button style="width:100%" onclick="login()">Entrar</button>${S.err?`<div class="al er">${esc(S.err)}</div>`:''}</div></div>`;return}
 const tabs=isAdm()?[['painel','Painel'],['custos','Custos'],['fat','Faturamento'],['ficha','Fichas'],['lancar','Lançar'],['hist','Histórico'],['rel','Relatórios'],['eq','Equipe']]:[['lancar','Lançar'],['hist','Histórico']];
 let m='';if(S.tab==='painel'&&isAdm())m=vPainel();else if(S.tab==='rel'&&isAdm())m=vRel();else if(S.tab==='custos'&&isAdm())m=vCustos();else if(S.tab==='fat'&&isAdm())m=vFat();else if(S.tab==='ficha'&&isAdm())m=vFicha();else if(S.tab==='eq'&&isAdm())m=pEquipe();else if(S.tab==='hist')m=vHist();else m=vLancar();
 a.innerHTML=`<header><b class="hl"><img src="${LOGO}" alt=""><span>Delícia</span> <em>Gelada</em></b><input class="srch" id="gs" type="search" placeholder="Buscar nota, mercado ou produto" value="${esc(S.hist.q||'')}"><span class="hr"><button class="bn2" data-a="tab:lancar">+ Nova nota</button><span class="chip"><i>${esc((S.p.nome||'?')[0].toUpperCase())}</i><span><b>${esc(S.p.nome)}</b><small>${isAdm()?'Administrador':'Funcionária'}</small></span></span><button class="s" data-a="senha">Senha</button><button class="s" data-a="sair">Sair</button></span></header><main>${m}</main><nav><div class="sb"><img src="${LOGO}" alt=""><div><span>Delícia</span><br><em>Gelada</em></div></div><div class="ml">MENU</div>${tabs.map(([k,l])=>`<a data-a="tab:${k}" class="${S.tab===k?'on':''}">${ic({painel:'home',custos:'custos',fat:'fat',ficha:'ficha',lancar:'cam',hist:'his',rel:'rel',eq:'eq'}[k])}<span>${l}</span></a>`).join('')}</nav>`;
 $('#modal').innerHTML=S.modal||'';chartPainel()}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;if(k==='nada'){e.stopPropagation();return}
 if(k.startsWith('tab:')){S.tab=k.slice(4);S.ok='';S.erro='';S.modal=null;if(S.tab==='eq')await vEquipe();else render()}
 else if(k==='fechar'){S.modal=null;render()}else if(k==='sair')sair();
 else if(k==='senha'){const p=prompt('Nova senha (mínimo 8 caracteres):');if(p&&p.length>=8){const{error}=await sb.auth.updateUser({password:p});alert(error?'Não foi possível alterar: '+error.message:'Senha alterada.')}else if(p)alert('Use pelo menos 8 caracteres.')}
 else if(k.startsWith('nota:'))vNota(k.slice(5));
 else if(k.startsWith('conf:')){await sb.from('notas').update({status:'conferida',leitura:'completa'}).eq('id',k.slice(5));S.modal=null;await carregar();render()}
 else if(k==='add'){S.draft.itens.push({inc:[]});render()}else if(k.startsWith('rm:')){S.draft.itens.splice(+k.slice(3),1);render()}
 else if(k==='manual'){S.draft={files:[],n:{data_emissao:new Date().toISOString().slice(0,10)},itens:[{}],manual:true};S.erro='';S.ok='';render()}
 else if(k==='salvar')salvar();else if(k==='relerx')ler();else if(k==='cancel'){S.draft=null;S.erro='';render()}
 else if(k==='pdf')pdf();
 else if(k.startsWith('tg:')){const[,id,v]=k.split(':');await sb.from('profiles').update({ativo:v==='true'}).eq('id',id);vEquipe()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.n){S.draft.n[t.dataset.n]=t.value;const c=$('#chk');if(c&&t.dataset.n==='total')c.innerHTML=chk(conf())}
 else if(t.dataset.i!=null){S.draft.itens[+t.dataset.i][t.dataset.k]=t.value;const c=$('#chk');if(c&&t.dataset.k==='vt')c.innerHTML=chk(conf())}
 else if(t.dataset.h){S.hist[t.dataset.h]=t.value;clearTimeout(S.tm);S.tm=setTimeout(()=>{render();const el=document.querySelector(`[data-h="${t.dataset.h}"]`);if(el&&el.type!=='date'){el.focus();el.setSelectionRange(99,99)}},350)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.r){S.rel[t.dataset.r]=t.value;if(t.dataset.r==='v')S.rel.mer='';render()}});
boot();
</script></body></html>
